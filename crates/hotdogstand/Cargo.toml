[package]
name = "hotdogstand"
description = "A ticket manager on your own computer, with the look of Windows 7"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["ticket", "issue-tracker", "slint", "windows-7", "desktop"]
categories = ["gui"]
publish = false

[dependencies]
hds-core.workspace = true
hds-store.workspace = true
anyhow.workspace = true
jiff.workspace = true
rfd.workspace = true
# The winit accessor lets a window with no system frame ask the system to
# resize it.
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build.workspace = true

# Puts the icon and the name of the application into the .exe file.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
