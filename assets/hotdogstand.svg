<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HotDogStand">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f0fb"/>
      <stop offset="0.3" stop-color="#b9d4ee"/>
      <stop offset="1" stop-color="#7ca6d3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9c2"/>
      <stop offset="0.5" stop-color="#ffe866"/>
      <stop offset="1" stop-color="#f7c832"/>
    </linearGradient>
    <linearGradient id="close" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f29a86"/>
      <stop offset="0.5" stop-color="#d9442f"/>
      <stop offset="1" stop-color="#a81f12"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#9dbfe2"/>
    </linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe2a4"/>
      <stop offset="0.5" stop-color="#e9ad52"/>
      <stop offset="1" stop-color="#b8701f"/>
    </linearGradient>
    <linearGradient id="sausage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58467"/>
      <stop offset="0.45" stop-color="#d7402b"/>
      <stop offset="1" stop-color="#8f1d10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- drop shadow -->
  <rect x="9" y="16" width="112" height="104" rx="9" fill="#1b2d44" opacity="0.4" filter="url(#shadow)"/>

  <!-- window frame -->
  <rect x="7" y="11" width="114" height="106" rx="8" fill="url(#frame)" stroke="#2e5d8f" stroke-width="1.6"/>
  <rect x="8.8" y="12.8" width="110.4" height="102.4" rx="6.6" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="1.2"/>
  <!-- title-bar gloss -->
  <path d="M9 19 a6 6 0 0 1 6 -6 h98 a6 6 0 0 1 6 6 v10 H9 z" fill="url(#gloss)"/>

  <!-- caption buttons -->
  <rect x="66" y="16" width="13" height="12" rx="2.5" fill="url(#btn)" stroke="#4a6f98" stroke-width="1"/>
  <rect x="79" y="16" width="13" height="12" rx="2.5" fill="url(#btn)" stroke="#4a6f98" stroke-width="1"/>
  <rect x="92" y="16" width="22" height="12" rx="2.5" fill="url(#close)" stroke="#6b150c" stroke-width="1"/>
  <path d="M67 17 h11 v5 h-11 z M80 17 h11 v5 h-11 z M93 17 h20 v5 h-20 z" fill="#fff" opacity="0.35"/>
  <path d="M69.5 24.5 h6" stroke="#2c4a6e" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="82.5" y="19" width="6" height="5.5" fill="none" stroke="#2c4a6e" stroke-width="1.4"/>
  <path d="M100 19 l6 6 M106 19 l-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- client area -->
  <rect x="13" y="32" width="102" height="79" rx="3" fill="#4d7eab"/>
  <rect x="14" y="33" width="100" height="77" rx="2.5" fill="url(#client)"/>
  <path d="M14 35.5 a2.5 2.5 0 0 1 2.5 -2.5 h95 a2.5 2.5 0 0 1 2.5 2.5 v14 H14 z" fill="#fff" opacity="0.45"/>

  <!-- ticket list rows -->
  <g stroke-linecap="round">
    <path d="M22 42 h4 M22 51 h4 M22 60 h4" stroke="#d93a2a" stroke-width="4"/>
    <path d="M31 42 h46 M31 51 h32 M31 60 h40" stroke="#c48e1a" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- hot dog -->
  <ellipse cx="64" cy="105" rx="44" ry="4" fill="#8a5a10" opacity="0.45" filter="url(#soft)"/>
  <rect x="20" y="68" width="88" height="37" rx="16" fill="url(#bun)" stroke="#7d4b12" stroke-width="1.6"/>
  <path d="M25 72 a9 9 0 0 1 9 -3 h60 a9 9 0 0 1 9 3" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <rect x="15" y="68" width="98" height="20" rx="10" fill="url(#sausage)" stroke="#5f130a" stroke-width="1.6"/>
  <rect x="21" y="70.5" width="86" height="4.5" rx="2.25" fill="#fff" opacity="0.4"/>
  <path d="M24 78 q6.5 -6.5 13 0 t13 0 t13 0 t13 0 t13 0 t13 0" fill="none" stroke="#9c6b00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 78 q6.5 -6.5 13 0 t13 0 t13 0 t13 0 t13 0 t13 0" fill="none" stroke="#ffd21a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
