# Formats, lints, and tests the workspace on the three systems that
# HotDogStand runs on. The toolchain comes from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Slint needs these to build on Linux. Windows and macOS have them.
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Starts the application and uses it as a person does, through the MCP
  # server of Slint and its headless backend. See scripts/smoke_test.py.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SLINT_EMIT_DEBUG_INFO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke

      - name: Build with the MCP server
        run: cargo build -p hotdogstand --features slint/mcp

      - name: Run the smoke test
        shell: bash
        run: python scripts/smoke_test.py target/debug/hotdogstand --headless --out smoke

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke
