[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/Stiven-Gjekaj/HotDogStand"

[workspace.dependencies]
hds-core = { path = "crates/hds-core" }
hds-store = { path = "crates/hds-store" }
slint = "=1.18.1"
slint-build = "=1.18.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
csv = "=1.4.0"
jiff = "=0.2.37"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
rfd = "=0.17.2"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
